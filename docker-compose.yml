services:

  db:
    image: pgvector/pgvector:pg16
    container_name: bookmark-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookmark
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - bookmark_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d bookmark" ]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: bookmark-ollama
    restart: unless-stopped

    volumes:
      - bookmark_ollama_data:/root/.ollama

    ports:
      - "8082:11434"


    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: bookmark-backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8080

    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-this-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend

      DB_NAME: bookmark
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432

      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_HOST: http://ollama:11434

      EMBEDDING_MODEL: nomic-embed-text-v2-moe
      GENERATION_MODEL: gemma4:e2b

      BOOKMARK_SERVER_PORT: 8080
      BOOKMARK_DEV_MODE: ${BOOKMARK_DEV_MODE:-False}
      METRICS_DB_PATH: /app/metrics/bookmark_metrics.sqlite
      HF_HUB_DISABLE_XET: "1"

    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - bookmark_whisper_cache:/root/.cache/huggingface

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: bookmark-worker

    restart: unless-stopped

    command: python manage.py run_worker

    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-this-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}

      DB_NAME: bookmark
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432

      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: nomic-embed-text-v2-moe
      GENERATION_MODEL: gemma4:e2b
      METRICS_DB_PATH: /app/metrics/bookmark_metrics.sqlite

    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - bookmark_whisper_cache:/root/.cache/huggingface

    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: bookmark-frontend
    restart: unless-stopped

    environment:
      PORT: 8081
      REACT_APP_API_URL: http://localhost:8080
      VITE_API_URL: http://backend:8080
      BROWSER: none
      HOST: 0.0.0.0

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "8081:8081"

    depends_on:
      - backend

volumes:
  bookmark_db_data:
    driver: local

  bookmark_ollama_data:
    driver: local

  bookmark_whisper_cache:
    driver: local
